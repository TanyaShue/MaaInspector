name: Build Tauri (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      maa_framework_version:
        description: 'MaaFramework release version, for example v5.10.0'
        required: false
        default: 'v5.10.0'
      release_tag:
        description: 'Release tag to build when manually dispatched, for example v0.7.0'
        required: false
      prerelease:
        description: 'Publish the manually dispatched build as a prerelease'
        type: boolean
        required: false
        default: true

defaults:
  run:
    shell: pwsh

permissions:
  contents: write

env:
  DEFAULT_MAA_FRAMEWORK_VERSION: "v5.10.0"
  # Keep peak memory predictable on GitHub's Windows runners. The final Tauri
  # link is memory-heavy and has previously crashed rustc with 0xc0000005.
  CARGO_BUILD_JOBS: "2"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove package-lock.json
        run: Remove-Item -Path "package-lock.json" -Force -ErrorAction SilentlyContinue

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Git
        run: git config --global core.autocrlf false

      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          # A failed run can stop before Cargo writes target artifacts. Saving that
          # result would poison the immutable key and force every rerun to rebuild.
          cache-on-failure: false

      - name: Report Rust cache
        run: |
          "Rust cache hit: ${{ steps.rust-cache.outputs.cache-hit }}" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Resolve release inputs
        id: release
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace("${{ inputs.release_tag }}")) {
            $tag = "${{ inputs.release_tag }}"
          }

          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with v, got '$tag'"
          }

          $isPrerelease = $tag.Contains("-")
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $isPrerelease = "${{ inputs.prerelease }}" -eq "true"
          }

          $maaVersion = "${{ env.DEFAULT_MAA_FRAMEWORK_VERSION }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace("${{ inputs.maa_framework_version }}")) {
            $maaVersion = "${{ inputs.maa_framework_version }}"
          }
          if (-not $maaVersion.StartsWith("v")) {
            $maaVersion = "v$maaVersion"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "maa_version=$maaVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "MAA_FRAMEWORK_VERSION=$maaVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare MaaFramework SDK
        run: .\scripts\prepare-maa-framework.ps1 -Version "${{ steps.release.outputs.maa_version }}"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        run: |
          pnpm lint
          pnpm type-check
          pnpm test

      - name: Set version from tag
        run: |
          $version = "${{ steps.release.outputs.version }}"

          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

          $cargoPath = "src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace '(?m)^version = ".*"', "version = `"$version`""
          Set-Content -Path $cargoPath -Value $cargo

          $json = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Generate changelog
        id: changelog
        run: |
          $body = .\scripts\generate-changelog.ps1 -Tag "${{ steps.release.outputs.tag }}" -Stdout

          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare and validate updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_BASE64)) {
            throw "Missing GitHub Actions secret: TAURI_SIGNING_PRIVATE_KEY_BASE64"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing GitHub Actions secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          }

          try {
            $keyBytes = [Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY_BASE64)
            $key = [Text.Encoding]::UTF8.GetString($keyBytes)
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY_BASE64 is not valid Base64: $($_.Exception.Message)"
          }

          if ([string]::IsNullOrWhiteSpace($key)) {
            throw "Decoded updater signing key is empty"
          }

          # Exercise the same decoder before the expensive Rust build. This
          # catches a malformed secret in seconds instead of after packaging.
          $env:TAURI_SIGNING_PRIVATE_KEY = $key
          pnpm tauri signer sign pnpm-lock.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Updater signing key self-test failed"
          }
          Remove-Item -LiteralPath "pnpm-lock.yaml.sig" -Force -ErrorAction SilentlyContinue

          "TAURI_SIGNING_PRIVATE_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "MaaInspector ${{ steps.release.outputs.tag }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          releaseDraft: false
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          projectPath: "."
          tauriScript: "pnpm tauri"
